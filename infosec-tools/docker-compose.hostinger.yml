# Compose for Hostinger Docker Manager (same pattern as the other projects: pull an image,
# Traefik on entrypoint websecure + resolver letsencrypt). Uses the stock node:24-alpine
# image; at start-up Node fetches this app from the public repo, pinned to one commit,
# over verified HTTPS. To deploy a new version, set the APP_REF project environment
# variable (or the default below) to the commit and redeploy.
# ADMIN_PASSWORD is supplied as a project environment variable.
services:
  infosec-tools:
    image: node:24-alpine
    restart: unless-stopped
    user: node
    working_dir: /app
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - APP_REF=${APP_REF:-fc415ccfa09bef4a80e64adcb126382f87bfebe4}
      - DATA_DIR=/home/node/data
      - NODE_ENV=production
      - PORT=8080
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/src &&
        node -e 'fetch("https://codeload.github.com/ShivdaSaj/sajin-rea/tar.gz/" + process.env.APP_REF).then(async (r) => { if (!r.ok) throw new Error("download failed: HTTP " + r.status); process.stdout.write(Buffer.from(await r.arrayBuffer())); })' |
        tar -xz -C /tmp/src &&
        cp -r /tmp/src/*/infosec-tools/. /app/ &&
        rm -rf /tmp/src &&
        exec node server.mjs
    volumes:
      - infosec-tools-data:/home/node
    tmpfs:
      - /app:uid=1000,gid=1000,mode=0755
      - /tmp:uid=1000,gid=1000
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.infosectools.rule=Host(`infosectools.sajinshivdas.online`)
      - traefik.http.routers.infosectools.entrypoints=websecure
      - traefik.http.routers.infosectools.tls=true
      - traefik.http.routers.infosectools.tls.certresolver=letsencrypt
      - traefik.http.services.infosectools.loadbalancer.server.port=8080

volumes:
  infosec-tools-data:
