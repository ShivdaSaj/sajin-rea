<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infosec Tools</title>
  <meta name="description" content="Infosec Tools — IT utilities, Cipher Lab, Web Recon and Network Toolkit in one place.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Infosec Tools home">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 2 4 7v8c0 7.5 5.1 13.3 12 15 6.9-1.7 12-7.5 12-15V7L16 2z" fill="var(--accent)"/><path d="m11 16 3.5 3.5L21.5 12" stroke="var(--on-accent)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="site-title">Infosec Tools</span>
    </a>
    <div class="search-wrap">
      <input id="global-search" type="search" placeholder="Search all tools…  ( / )" autocomplete="off" aria-label="Search all tools">
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
  </header>
  <nav id="tabs" class="tabs" aria-label="Tool categories"></nav>
  <main id="view" tabindex="-1"></main>
  <footer class="footer">
    <span id="footer-stats"></span>
    <a href="/admin">Admin</a>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
