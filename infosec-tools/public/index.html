<!doctype html>
<html lang="en" data-theme="{{THEME}}" data-mode="{{MODE}}" data-default-theme="{{THEME}}" style="{{ACCENT_STYLE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="IT, CyberChef, web and network toolkits in one place: 700 security and engineering tools that run in your browser or live from the server.">
  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/atlas.css">
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <canvas id="bg" aria-hidden="true"></canvas>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Home">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs><path d="M16 3 5 7.5v7.8c0 6.6 4.6 11.7 11 13.2 6.4-1.5 11-6.6 11-13.2V7.5z" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linejoin="round"/><path d="m12.5 12.5-3 3 3 3M19.5 12.5l3 3-3 3M17.2 11l-2.4 9" fill="none" stroke="url(#lg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text" id="brandText">Infosec<b>Tools</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/toolkits" data-nav="toolkits">Toolkits</a>
      <a href="#/explore" data-nav="explore">Explore</a>
      <a href="#/recipe" data-nav="recipe">Recipes</a>
      <a href="#/saved" data-nav="saved">Saved <span class="pill" id="savedCount">0</span></a>
    </nav>
    <div class="top-actions">
      <button class="search-trigger" id="openSearch" type="button" aria-label="Search (Ctrl+K)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search tools…</span><kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle colour theme"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <div class="brand small"><span class="brand-text" id="footerBrand">Infosec<b>Tools</b></span></div>
        <p id="footerAbout"></p>
      </div>
      <div class="footer-meta" id="footerMeta"></div>
    </div>
  </footer>

  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="palette-box">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="paletteInput" type="search" placeholder="Search tools, categories and toolkits…" autocomplete="off" spellcheck="false" aria-controls="paletteResults">
        <kbd>Esc</kbd>
      </div>
      <ul class="palette-results" id="paletteResults" role="listbox"></ul>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-scrim" data-close></div>
    <aside class="drawer-panel wide" id="drawerPanel"></aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
