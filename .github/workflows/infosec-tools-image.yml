name: Infosec Tools image

on:
  push:
    branches: [main, claude/eloquent-curie-pot0eb]
    paths: ["infosec-tools/**", ".github/workflows/infosec-tools-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run native op tests
        working-directory: infosec-tools
        run: node --test test/*.test.mjs

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/infosec-tools
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: infosec-tools
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=Infosec Tools
            org.opencontainers.image.description=Unified IT, crypto, web-recon and network toolkit
